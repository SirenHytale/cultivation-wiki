<!doctype html>

<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #0E0603;
    font-family: "Cinzel", Georgia, serif;
    color: #F6D77B;
  }
  .scene { position: absolute; inset: 0; width: 1200px; height: 630px; }
  .scrim {
    position: absolute; inset: 0;
    background: radial-gradient(62% 58% at 34% 50%, rgba(14,6,3,0.80), rgba(14,6,3,0.36) 60%, transparent 100%);
  }
  .inner {
    position: absolute; inset: 0;
    display: flex; align-items: center; gap: 54px;
    padding: 0 84px;
  }
  .seal { width: 224px; height: 224px; flex: none; filter: drop-shadow(0 0 34px rgba(246,215,123,0.34)); }
  .text { min-width: 0; }
  h1 {
    font-size: 92px; font-weight: 700; letter-spacing: 0.10em; line-height: 1;
    color: #F6D77B;
    text-shadow: 0 0 54px rgba(246,215,123,0.32), 0 4px 22px rgba(0,0,0,0.75);
  }
  .han {
    font-family: "Noto Serif SC", serif; font-weight: 600;
    font-size: 30px; letter-spacing: 0.52em; color: #C9433A;
    margin: 16px 0 20px; text-indent: 0.52em;
  }
  .rule { width: 240px; height: 2px; background: linear-gradient(90deg, #C9A227, rgba(201,162,39,0)); margin-bottom: 20px; }
  p.lede { font-family: ui-sans-serif, "Segoe UI", sans-serif; font-size: 26px; line-height: 1.45; color: #E4D6B0; max-width: 610px; }
  .foot {
    position: absolute; left: 84px; bottom: 46px;
    display: flex; align-items: center; gap: 16px;
    font-size: 19px; letter-spacing: 0.20em; text-transform: uppercase; color: #B9A87E;
  }
  .foot .dot { color: #8C6B1F; }
  .badge {
    position: absolute; right: 66px; bottom: 46px;
    border: 1px solid #8C6B1F; border-radius: 4px;
    padding: 9px 20px; font-size: 19px; letter-spacing: 0.16em;
    color: #F6D77B; background: rgba(92,23,18,0.55);
  }
</style>
</head>

    </g>

</html>
